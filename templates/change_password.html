{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h4 class="mb-3">Đổi mật khẩu của tôi</h4>
<form method="post" class="card p-4" style="max-width:480px;">
  <div class="mb-3">
    <label class="form-label">Mật khẩu hiện tại *</label>
    <input type="password" name="current_password" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Mật khẩu mới *</label>
    <input type="password" name="new_password" class="form-control" required minlength="4">
  </div>
  <div class="mb-3">
    <label class="form-label">Nhập lại mật khẩu mới *</label>
    <input type="password" name="confirm_password" class="form-control" required minlength="4">
  </div>
  <button type="submit" class="btn btn-success">Đổi mật khẩu</button>
</form>
{% endblock %}
