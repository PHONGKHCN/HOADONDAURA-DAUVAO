{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu{% endblock %}
{% block content %}
<h4 class="mb-3">Đặt lại mật khẩu cho "{{ user.full_name or user.username }}"</h4>
<form method="post" class="card p-4" style="max-width:480px;">
  <div class="mb-3">
    <label class="form-label">Mật khẩu mới *</label>
    <input type="password" name="new_password" class="form-control" required minlength="4">
  </div>
  <div class="mb-3">
    <label class="form-label">Nhập lại mật khẩu mới *</label>
    <input type="password" name="confirm_password" class="form-control" required minlength="4">
  </div>
  <button type="submit" class="btn btn-success">Đặt lại mật khẩu</button>
  <a href="{{ url_for('user_list') }}" class="btn btn-outline-secondary">Hủy</a>
</form>
{% endblock %}
